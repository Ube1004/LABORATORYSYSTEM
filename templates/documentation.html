<!DOCTYPE html>
<html>
<head>
    <title>Documentation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>

<body>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="{{ url_for('static', filename='script.js') }}" defer></script>

<div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="logo-header">
            <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo">

            <h2 class="title">
                SCIENCE LABORATORY IN CITY COLLEGE OF ANGELES
            </h2>
        </div>


        <button class="menu-btn" onclick="location.href='dashboard'">
            📊 Dashboard
        </button>

        <button class="menu-btn" onclick="location.href='borrow'">
            📥 Borrowing
        </button>

        <button class="menu-btn" onclick="location.href='returning'">
            🔄 Returning
        </button>

        <button class="menu-btn" onclick="location.href='broken'">
            📋 List Items
        </button>



        <button class="menu-btn active" onclick="location.href='documentation'">
            📄 Documentation
        </button>


        <!-- USER -->
        <div class="user-box">
            <p class="name">{{   session['username']   }}</p>
            <small>basilio@cca.edu.ph</small>
        </div>


        <!-- LOGOUT -->
        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </div>


  <div class="main">

    <h2 class="page-title">
        Documentation
    </h2>

        <!-- DOCUMENTATION MODAL -->
        <div id="docModal" class="modal">

            <div class="modal-content">

                <span class="close" onclick="closeDoc()">
                    &times;
                </span>

                <h3 id="modalTitle"></h3>

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Contact</th>
                            <th>Institute</th>
                            <th>Date</th>
                        </tr>
                    </thead>

                    <tbody id="docTable"></tbody>

                </table>

            </div>

        </div>


        <!-- CAMERA -->
        <video id="camera" autoplay playsinline></video>

        <canvas id="canvas" style="display: none;"></canvas>


        <!-- CAMERA BUTTON -->
        <div class="button-container">

            <button onclick="takePhoto()">
                 Take Photo
            </button>

        </div>


        <!-- PHOTO PREVIEW MODAL -->
        <div id="photoModal" class="photo-modal">

            <div class="photo-container">

                <!-- CAPTURED PHOTO -->
                <img
                    id="preview"
                    class="preview-image"
                    alt="Captured Photo"
                >


                <!-- PHOTO ACTIONS -->
                <div class="photo-actions">

                    <button
                        class="remove-btn"
                        onclick="removePhoto()"
                    >
                        Remove
                    </button>


                    <button
                        class="confirm-photo-btn"
                        onclick="confirmPhoto()"
                    >
                        Confirm
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
